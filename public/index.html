<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>ONLANG Vereins-App</title>
    <base href="/" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="light dark" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ONLANG" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="theme-color" content="#111111" />

    

    <script>
      (function() {
        const params = new URLSearchParams(window.location.search);
        const kundeAusUrl = (params.get('kunde') || '').trim();
        const gespeicherterKunde = (localStorage.getItem('kundenId') || '').trim();
        const kunde = kundeAusUrl || gespeicherterKunde;

        if (kundeAusUrl) {
          localStorage.setItem('kundenId', kundeAusUrl);
          document.cookie =
            'kundenId=' +
            encodeURIComponent(kundeAusUrl) +
            '; path=/; max-age=31536000; SameSite=Lax';
        }

        // Der Manifest-Link wird erst hier angelegt, gleich mit dem Verein.
        // Ein fester Link ohne ?kunde= wird vom iPhone sofort geladen; die
        // spaetere Aenderung der Adresse zaehlt dort nicht mehr, und die App
        // startet vom Home-Bildschirm ohne Verein.
        const manifest = document.createElement('link');
        manifest.id = 'onlang-manifest';
        manifest.rel = 'manifest';
        manifest.href = kunde
          ? '/manifest.webmanifest?kunde=' + encodeURIComponent(kunde)
          : '/manifest.webmanifest';
        document.head.appendChild(manifest);
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
  </body>
</html>
